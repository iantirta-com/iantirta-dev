[package]
name = "iantirta-dev"
version = "0.1.0"
edition = "2024"
authors = [
    "iantirta.com <ian@iantirta.com>"
]

[[bin]]
name = "idev"
path = "src/main.rs"

[dependencies]
clap = { version = "*", features = ["derive"] }
regex = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
enum_dispatch = "*"
globset = "*"
toml = "*"
log = "*"
env_logger = "*"
owo-colors = "*"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "*", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Console",
] }
